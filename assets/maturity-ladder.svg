<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="424"
     viewBox="0 0 1280 424" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070C15"/>
      <stop offset="55%" stop-color="#0B1524"/>
      <stop offset="100%" stop-color="#101E33"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#37A2FF"/>
      <stop offset="60%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="blueviolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#37A2FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#37A2FF" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#37A2FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowv" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1B2B44" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C97B8"/>
    </marker>
    <marker id="arwb" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37A2FF"/>
    </marker>
  </defs>
  <rect width="1280" height="424" fill="url(#bg)"/>
  <rect width="1280" height="424" fill="url(#grid)"/>
  <ellipse cx="1050" cy="20" rx="380" ry="200" fill="url(#glowv)"/>
  <rect x="0" y="0" width="7" height="424" fill="url(#rail)"/>
  <text x="56" y="56" font-family="'Liberation Sans','DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="3.6" fill="#4E7FB8">MATURITY, STATED PLAINLY</text>
  <text x="54" y="96" font-family="'Liberation Sans','DejaVu Sans',Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#F3F7FD">Four levels — and which repos sit at each</text>
  <text x="56" y="122" font-family="'Liberation Sans','DejaVu Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#7C97B8">Labelled on every repository. A portfolio that overstates itself is a liability, not an asset.</text>
  <rect x="48" y="150" width="1184" height="54" rx="9" fill="#0C1726" fill-opacity="1.0" stroke="#28405F" stroke-width="1"/>
  <rect x="49" y="160" width="3.5" height="34" rx="1.75" fill="#34D399"/>
  <text x="72" y="174" font-family="'DejaVu Sans Mono',Consolas,'Liberation Mono',Menlo,monospace" font-size="15" font-weight="700" fill="#34D399">L4</text>
  <text x="112" y="174" font-family="'Liberation Sans','DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.4" fill="#F3F7FD">ENFORCED</text>
  <text x="112" y="192" font-family="'Liberation Sans','DejaVu Sans',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="400" fill="#7C97B8">Blocks the merge or the request. Runs in CI or at runtime.</text>
  <text x="720" y="182" font-family="'DejaVu Sans Mono',Consolas,'Liberation Mono',Menlo,monospace" font-size="10.4" font-weight="400" fill="#4E7FB8">OPA/Rego gates · Sigma in CI · PIM/JIT</text>
  <rect x="48" y="214" width="1184" height="54" rx="9" fill="#0C1726" fill-opacity="1.0" stroke="#28405F" stroke-width="1"/>
  <rect x="49" y="224" width="3.5" height="34" rx="1.75" fill="#37A2FF"/>
  <text x="72" y="238" font-family="'DejaVu Sans Mono',Consolas,'Liberation Mono',Menlo,monospace" font-size="15" font-weight="700" fill="#37A2FF">L3</text>
  <text x="112" y="238" font-family="'Liberation Sans','DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.4" fill="#F3F7FD">TESTED</text>
  <text x="112" y="256" font-family="'Liberation Sans','DejaVu Sans',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="400" fill="#7C97B8">Executable, with a test suite and a CI workflow.</text>
  <text x="720" y="246" font-family="'DejaVu Sans Mono',Consolas,'Liberation Mono',Menlo,monospace" font-size="10.4" font-weight="400" fill="#4E7FB8">detection-as-code · IAM auditor · threat-intel sync</text>
  <rect x="48" y="278" width="1184" height="54" rx="9" fill="#0C1726" fill-opacity="1.0" stroke="#28405F" stroke-width="1"/>
  <rect x="49" y="288" width="3.5" height="34" rx="1.75" fill="#22D3EE"/>
  <text x="72" y="302" font-family="'DejaVu Sans Mono',Consolas,'Liberation Mono',Menlo,monospace" font-size="15" font-weight="700" fill="#22D3EE">L2</text>
  <text x="112" y="302" font-family="'Liberation Sans','DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.4" fill="#F3F7FD">LAB</text>
  <text x="112" y="320" font-family="'Liberation Sans','DejaVu Sans',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="400" fill="#7C97B8">Runs against synthetic data; needs a tenant or cluster to go end-to-end.</text>
  <text x="720" y="310" font-family="'DejaVu Sans Mono',Consolas,'Liberation Mono',Menlo,monospace" font-size="10.4" font-weight="400" fill="#4E7FB8">log-integration (AWS/Azure/GCP) · container lab</text>
  <rect x="48" y="342" width="1184" height="54" rx="9" fill="#0C1726" fill-opacity="1.0" stroke="#28405F" stroke-width="1"/>
  <rect x="49" y="352" width="3.5" height="34" rx="1.75" fill="#8B5CF6"/>
  <text x="72" y="366" font-family="'DejaVu Sans Mono',Consolas,'Liberation Mono',Menlo,monospace" font-size="15" font-weight="700" fill="#8B5CF6">L1</text>
  <text x="112" y="366" font-family="'Liberation Sans','DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.4" fill="#F3F7FD">DESIGN</text>
  <text x="112" y="384" font-family="'Liberation Sans','DejaVu Sans',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="400" fill="#7C97B8">Documented reference: design, SOP or spec. Not an executed system.</text>
  <text x="720" y="374" font-family="'DejaVu Sans Mono',Consolas,'Liberation Mono',Menlo,monospace" font-size="10.4" font-weight="400" fill="#4E7FB8">IR playbooks · SOC L2/L3 SOPs · architecture references</text>

</svg>
